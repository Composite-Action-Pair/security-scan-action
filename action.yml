name: 'Security Scan Suite'
description: 'Runs static analysis, dependency scanning, SBOM generation, and DAST for Node.js projects'

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Run npm audit (Dependency Security Scan - SCA)
      run: npm audit --json > npm-audit-report.json || true
      shell: bash

    - name: Install ESLint and security plugin (SAST)
      run: npm install --no-save eslint@8 eslint-plugin-security
      shell: bash

    - name: Run ESLint Security Scan (SAST)
      run: |
        npx eslint . --no-eslintrc \
          --parser-options=ecmaVersion:2021,sourceType:module \
          --env node,es2021 \
          --plugin security \
          --rule '{"security/detect-eval-with-expression": "error", "security/detect-non-literal-fs-filename": "warn", "security/detect-unsafe-regex": "error"}' \
          --format json --output-file eslint-report.json || true
      shell: bash

    - name: Install Syft (SBOM Generator)
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      shell: bash

    - name: Generate SBOM (CycloneDX format)
      run: syft . -o cyclonedx-json=sbom.json
      shell: bash

    - name: Start application in background
      run: |
        npm start &
        sleep 5
      shell: bash

    - name: Run OWASP ZAP Baseline Scan (DAST)
      run: |
        mkdir -p zap-output
        chmod -R 777 zap-output
        docker run --rm --network host \
          -v $(pwd)/zap-output:/zap/wrk/:rw \
          zaproxy/zap-stable zap-baseline.py \
          -t http://localhost:3000 \
          -J zap-report.json \
          -r zap-report.html || true
      shell: bash

    - name: Upload reports as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          npm-audit-report.json
          eslint-report.json
          sbom.json
          zap-output/zap-report.json
          zap-output/zap-report.html